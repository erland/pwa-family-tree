name: Tree browser UX

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser test runner without changing the production lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run tree UX tests
        run: npx playwright test -c playwright.ux.config.mjs
      - name: Save diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tree-ux-results
          path: test-results/
          if-no-files-found: ignore
